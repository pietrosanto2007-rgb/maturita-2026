<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Money Pro - Clean Edition</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        :root { --bg: #F2F2F7; --card: #FFFFFF; --text: #000000; --text-sec: #8E8E93; --border: #E5E5EA; --nav: rgba(255,255,255,0.85); }
        @media (prefers-color-scheme: dark) { :root { --bg: #000000; --card: #1C1C1E; --text: #FFFFFF; --text-sec: #EBEBF599; --border: #38383A; --nav: rgba(28,28,30,0.85); color-scheme: dark; } }
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .card-glass { background-color: var(--card); border: 1px solid var(--border); box-shadow: 0 4px 24px rgba(0,0,0,0.04); }
        .bottom-nav { background: var(--nav); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: var(--text-sec); transition: all 0.2s; } .nav-item.active { color: #007AFF; transform: scale(1.05); }
        .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .bottom-sheet { transform: translateY(100%); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); background: var(--bg); border-radius: 24px 24px 0 0; padding-bottom: env(safe-area-inset-bottom); }
        .bottom-sheet.active { transform: translateY(0); }
        .page { display: none; animation: fadeIn 0.3s ease-out; } .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .input-custom { background: var(--card); border: 1px solid var(--border); color: var(--text); outline: none; transition: 0.2s; width: 100%; padding: 1rem; border-radius: 0.75rem; }
        .chip { background: var(--card); border: 1px solid var(--border); color: var(--text-sec); padding: 0.5rem 1rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; white-space: nowrap; cursor: pointer; }
        .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
        .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen flex flex-col antialiased">

    <div id="modalOverlay" class="modal-overlay fixed inset-0 z-40" onclick="closeModal()"></div>
    <div id="addModal" class="bottom-sheet fixed bottom-0 left-0 right-0 z-50 flex flex-col h-[85vh] shadow-2xl">
        <div class="flex justify-center pt-3 pb-2"><div class="w-12 h-1.5 rounded-full" style="background: var(--border);"></div></div>
        <div class="px-6 pb-4 flex justify-between items-center">
            <h2 class="text-2xl font-bold">Nuovo Movimento</h2>
            <button onclick="closeModal()" class="p-2 rounded-full card-glass"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto px-6 pb-20">
            <div class="flex p-1 rounded-xl mb-6 card-glass">
                <button id="btnOut" onclick="setTxType('expense')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-black text-white dark:bg-white dark:text-black">Spesa</button>
                <button id="btnIn" onclick="setTxType('income')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-gray-500">Entrata</button>
            </div>
            <form id="addForm" class="flex flex-col gap-4" onsubmit="saveTransaction(event)">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Importo (€)</label>
                    <input type="number" id="txAmount" step="0.01" min="0.01" class="input-custom text-center text-3xl font-bold" placeholder="0.00" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Data</label>
                        <input type="date" id="txDate" class="input-custom" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Categoria</label>
                        <select id="txCategory" class="input-custom" required></select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Descrizione</label>
                    <input type="text" id="txDesc" class="input-custom" placeholder="Es. Pieno benzina...">
                </div>
                <button type="submit" id="saveBtn" class="w-full py-4 rounded-xl text-white font-bold text-lg mt-4 bg-blue-500 flex justify-center items-center gap-2">
                    <i data-lucide="save" class="w-5 h-5"></i> Salva
                </button>
            </form>
        </div>
    </div>

    <div class="flex-1 overflow-y-auto pb-24 pt-8 px-5">

        <div id="page-home" class="page active">
            <div class="flex justify-between items-center mb-6">
                <div><h1 class="text-3xl font-bold tracking-tight">Dashboard</h1><p class="text-sm font-medium text-gray-500 capitalize" id="monthTitle">Marzo 2026</p></div>
                <button onclick="loadData()" class="w-10 h-10 rounded-full flex items-center justify-center card-glass"><i data-lucide="refresh-cw" class="w-5 h-5 text-gray-500"></i></button>
            </div>

            <div class="card-glass rounded-3xl p-6 mb-6">
                <p class="text-xs uppercase tracking-wider font-bold text-center mb-2 text-gray-500">Saldo Attuale</p>
                <h2 class="text-5xl font-extrabold text-center tracking-tighter mb-6" id="uiBalance">€ 0,00</h2>
                <div class="flex justify-between border-t border-gray-200 dark:border-gray-800 pt-4">
                    <div class="text-center w-1/2 border-r border-gray-200 dark:border-gray-800"><p class="text-xs font-semibold text-gray-500">Entrate</p><p class="text-lg font-bold text-green-500" id="uiIn">€ 0,00</p></div>
                    <div class="text-center w-1/2"><p class="text-xs font-semibold text-gray-500">Uscite</p><p class="text-lg font-bold text-red-500" id="uiOut">€ 0,00</p></div>
                </div>
            </div>

            <div class="flex gap-2 overflow-x-auto no-scrollbar mb-4 pb-2">
                <button class="chip active" onclick="setListFilter('all', this)">Tutti</button>
                <button class="chip" onclick="setListFilter('expense', this)">Uscite</button>
                <button class="chip" onclick="setListFilter('income', this)">Entrate</button>
            </div>

            <div class="card-glass rounded-3xl p-5" id="txList">
                <p class="text-center text-gray-500 py-4">Caricamento in corso...</p>
            </div>
        </div>

        <div id="page-stats" class="page">
            <h1 class="text-3xl font-bold mb-6">Analisi</h1>
            <div class="card-glass rounded-3xl p-6 mb-6"><div class="relative w-full h-64"><canvas id="mainChart"></canvas></div></div>
        </div>
    </div>

    <div class="bottom-nav fixed bottom-0 left-0 right-0 z-30 flex justify-around pt-3 pb-8 px-2">
        <div class="nav-item active flex flex-col items-center gap-1 w-16 cursor-pointer" onclick="switchTab('home', this)"><i data-lucide="layout-dashboard" class="w-6 h-6"></i><span class="text-[10px] font-bold">Home</span></div>
        <div class="relative -top-6"><button onclick="openModal()" class="w-14 h-14 rounded-full flex items-center justify-center text-white shadow-xl bg-blue-500 hover:scale-105 transition-transform"><i data-lucide="plus" class="w-7 h-7"></i></button></div>
        <div class="nav-item flex flex-col items-center gap-1 w-16 cursor-pointer" onclick="switchTab('stats', this)"><i data-lucide="pie-chart" class="w-6 h-6"></i><span class="text-[10px] font-bold">Analisi</span></div>
    </div>

    <script>
        lucide.createIcons();

        // 🚨 1. INSERISCI QUI LE TUE CHIAVI! 🚨
        const SUPABASE_URL = 'https://awdziofrrzbewrnsuorc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_dyFbd2EmfrzzCOR9nCsDXg_qkwJ1QjW';


        // IL FIX MAGICO: Usiamo "db" invece di "supabase" per non far litigare il codice!
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allTransactions = [];
        let chartInstance = null;
        let formType = 'expense';
        let currentFilter = 'all';

        // Categorie e Colori
        const CATEGORIES = {
            'food': { label: 'Cibo & Ristoranti', icon: 'pizza', col: '#FFCC00', bg: 'rgba(255,204,0,0.1)' },
            'transport': { label: 'Trasporti & Auto', icon: 'car', col: '#FF3B30', bg: 'rgba(255,59,48,0.1)' },
            'home': { label: 'Casa & Bollette', icon: 'home', col: '#5AC8FA', bg: 'rgba(90,200,250,0.1)' },
            'shopping': { label: 'Shopping', icon: 'shopping-cart', col: '#FF9500', bg: 'rgba(255,149,0,0.1)' },
            'salary': { label: 'Stipendio', icon: 'wallet', col: '#34C759', bg: 'rgba(52,199,89,0.1)' },
            'other': { label: 'Altro', icon: 'credit-card', col: '#007AFF', bg: 'rgba(0,122,255,0.1)' }
        };

        // Popola la select delle categorie
        const catSelect = document.getElementById('txCategory');
        Object.entries(CATEGORIES).forEach(([id, data]) => {
            const opt = document.createElement('option');
            opt.value = id; opt.innerText = data.label;
            catSelect.appendChild(opt);
        });

        // Imposta Mese corrente
        const mesi = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
        document.getElementById('monthTitle').innerText = `${mesi[new Date().getMonth()]} ${new Date().getFullYear()}`;

        // CORE: Caricamento Dati (ora usa db.from)
        async function loadData() {
            const listEl = document.getElementById('txList');

            if(SUPABASE_URL === 'INSERISCI_QUI_URL') {
                listEl.innerHTML = `<p class="text-center text-red-500 font-bold py-4">Inserisci le chiavi Supabase nel codice!</p>`;
                return;
            }

            try {
                const { data, error } = await db.from('transactions').select('*').order('date', { ascending: false });
                if (error) throw error;

                allTransactions = data || [];
                updateDashboard();
                renderList();
            } catch (err) {
                console.error("Errore:", err);
                listEl.innerHTML = `<p class="text-center text-red-500 py-4">${err.message}</p>`;
            }
        }

        // CORE: Disegna la lista
        function renderList() {
            const listEl = document.getElementById('txList');
            let filtered = allTransactions.filter(t => currentFilter === 'all' || t.type === currentFilter);

            if(filtered.length === 0) {
                listEl.innerHTML = '<div class="text-center py-10 text-gray-500"><i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 opacity-50"></i><p>Nessun movimento</p></div>';
                lucide.createIcons(); return;
            }

            let html = '';
            filtered.forEach(t => {
                const style = CATEGORIES[t.category_id] || CATEGORIES['other'];
                const sign = t.type === 'expense' ? '-' : '+';
                const colorClass = t.type === 'expense' ? 'text-current' : 'text-green-500';

                // Formatta data
                const dateObj = new Date(t.date);
                const dateStr = dateObj.toLocaleDateString('it-IT', { day: '2-digit', month: 'short' });

                html += `
                    <div class="flex justify-between items-center py-3 border-b border-gray-100 dark:border-gray-800">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0" style="background: ${style.bg}; color: ${style.col};">
                                <i data-lucide="${style.icon}" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <p class="font-bold text-base leading-tight">${t.description || style.label}</p>
                                <p class="text-xs text-gray-500 mt-0.5">${dateStr} • ${style.label}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <p class="font-bold ${colorClass}">${sign}${parseFloat(t.amount).toFixed(2)} €</p>
                            <button onclick="deleteTx('${t.id}')" class="text-red-500 opacity-50 hover:opacity-100"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                `;
            });

            listEl.innerHTML = html;
            lucide.createIcons();
        }

        // CORE: Aggiorna contatori
        function updateDashboard() {
            let tIn = 0, tOut = 0;
            const currentMonth = new Date().getMonth();

            allTransactions.forEach(t => {
                const d = new Date(t.date);
                if(d.getMonth() === currentMonth) {
                    if(t.type === 'expense') tOut += parseFloat(t.amount || 0);
                    else tIn += parseFloat(t.amount || 0);
                }
            });

            document.getElementById('uiBalance').innerText = `€ ${(tIn - tOut).toFixed(2)}`;
            document.getElementById('uiIn').innerText = `€ ${tIn.toFixed(2)}`;
            document.getElementById('uiOut').innerText = `€ ${tOut.toFixed(2)}`;
        }

        // CORE: Salva nuovo movimento (ora usa db.from)
        async function saveTransaction(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = 'Salvataggio...';

            const amount = parseFloat(document.getElementById('txAmount').value) || 0;
            const date = document.getElementById('txDate').value;
            const category_id = document.getElementById('txCategory').value;
            let description = document.getElementById('txDesc').value.trim();
            if(!description) description = CATEGORIES[category_id].label;

            try {
                const { error } = await db.from('transactions').insert([{ type: formType, amount, date, category_id, description }]);
                if (error) throw error;
                closeModal();
                loadData();
            } catch (err) {
                alert("Errore: " + err.message);
            } finally {
                btn.innerHTML = `<i data-lucide="save" class="w-5 h-5"></i> Salva`;
                lucide.createIcons();
            }
        }

        // CORE: Cancella movimento (ora usa db.from)
        async function deleteTx(id) {
            if(!confirm('Vuoi davvero cancellare questo movimento?')) return;
            await db.from('transactions').delete().eq('id', id);
            loadData();
        }

        // UI: Gestione Tab e Modale
        function switchTab(tabId, element) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.getElementById('page-' + tabId).classList.add('active');
            if(tabId === 'stats') drawChart();
        }

        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('addModal').classList.add('active');
            document.getElementById('txDate').valueAsDate = new Date();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.getElementById('addModal').classList.remove('active');
            document.getElementById('addForm').reset();
            setTxType('expense');
        }

        function setTxType(type) {
            formType = type;
            const btnOut = document.getElementById('btnOut');
            const btnIn = document.getElementById('btnIn');
            if(type === 'expense') {
                btnOut.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-black text-white dark:bg-white dark:text-black";
                btnIn.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-gray-500";
            } else {
                btnIn.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-green-500 text-white";
                btnOut.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-gray-500";
                document.getElementById('txCategory').value = 'salary';
            }
        }

        function setListFilter(filter, element) {
            currentFilter = filter;
            document.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            renderList();
        }

        // UI: Grafico
        function drawChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            const expenses = allTransactions.filter(t => t.type === 'expense' && new Date(t.date).getMonth() === new Date().getMonth());
            const totals = {};

            expenses.forEach(t => {
                const label = CATEGORIES[t.category_id] ? CATEGORIES[t.category_id].label : 'Altro';
                totals[label] = (totals[label] || 0) + parseFloat(t.amount);
            });

            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(totals).length ? Object.keys(totals) : ['Nessun dato'],
                    datasets: [{
                        data: Object.values(totals).length ? Object.values(totals) : [1],
                        backgroundColor: Object.values(totals).length ? ['#FF3B30', '#FF9500', '#FFCC00', '#34C759', '#5AC8FA', '#007AFF'] : ['#E5E5EA'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, cutout: '75%' }
            });
        }

        // Avvio automatico
        loadData();
    </script>
</body>
</html>
